<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-page">

        <nav class="dashboard-nav">

            <div class="dashboard-logo">
                🔐 Secure<span>Vault</span>
            </div>

            <button id="logoutBtn">
                Logout ↪
            </button>

        </nav>

        <main class="dashboard-content">

            <section class="welcome-card">

                <div class="dashboard-icon">
                    🛡️
                </div>

                <p class="dashboard-label">
                    AUTHENTICATION SUCCESSFUL
                </p>

                <h1>
                    Welcome, <span id="userName">User</span> 👋
                </h1>

                <p class="dashboard-description">
                    You have successfully logged into your
                    protected SecureVault dashboard.
                </p>

            </section>


            <section class="dashboard-grid">

                <div class="info-card">
                    <span>👤</span>

                    <div>
                        <small>USERNAME</small>
                        <strong id="dashboardUsername">
                            ---
                        </strong>
                    </div>
                </div>


                <div class="info-card">
                    <span>✉️</span>

                    <div>
                        <small>EMAIL</small>
                        <strong id="dashboardEmail">
                            ---
                        </strong>
                    </div>
                </div>


                <div class="info-card">
                    <span>🔒</span>

                    <div>
                        <small>SECURITY</small>
                        <strong>
                            Protected ✓
                        </strong>
                    </div>
                </div>

            </section>


            <div class="dashboard-footer">
                🟢 Your session is active and secure.
            </div>

        </main>

    </div>


    <script>

        const session = JSON.parse(
            sessionStorage.getItem("secureVaultSession")
        );

        // Protect dashboard
        if (!session) {

            window.location.href = "index.html";

        } else {

            document.getElementById("userName").textContent =
                session.username;

            document.getElementById("dashboardUsername").textContent =
                session.username;

            document.getElementById("dashboardEmail").textContent =
                session.email;
        }


        // Logout
        document.getElementById("logoutBtn")
            .addEventListener("click", () => {

                sessionStorage.removeItem(
                    "secureVaultSession"
                );

                window.location.href = "index.html";

            });

    </script>

</body>
</html>
