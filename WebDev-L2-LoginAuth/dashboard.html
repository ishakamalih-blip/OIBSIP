<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault | Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .dashboard {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .dashboard-card {
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.3);
        }

        .dashboard-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-top h1 {
            font-size: 30px;
        }

        .dashboard-top p {
            color: #64748b;
            margin-top: 5px;
        }

        .logout-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .welcome {
            padding: 25px;
            border-radius: 18px;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 7px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-card {
            padding: 22px;
            border-radius: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .stat-card span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .stat-card strong {
            font-size: 18px;
            color: #172033;
        }

        .security-status {
            margin-top: 25px;
            padding: 18px;
            border-radius: 14px;
            background: #f0fdf4;
            color: #15803d;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .dashboard-card {
                padding: 22px;
            }

            .dashboard-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">

        <div class="dashboard-card">

            <div class="dashboard-top">

                <div>
                    <h1>🔐 SecureVault</h1>
                    <p>Authentication Dashboard</p>
                </div>

                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </div>


            <div class="welcome">

                <h2>
                    Welcome, <span id="userName">User</span>! 👋
                </h2>

                <p>
                    You have successfully logged into your secure account.
                </p>

            </div>


            <div class="stats">

                <div class="stat-card">
                    <span>USERNAME</span>
                    <strong id="dashboardUsername">---</strong>
                </div>

                <div class="stat-card">
                    <span>EMAIL</span>
                    <strong id="dashboardEmail">---</strong>
                </div>

                <div class="stat-card">
                    <span>STATUS</span>
                    <strong>Active ✓</strong>
                </div>

            </div>


            <div class="security-status">
                🛡️ Account Protected — Authentication session is active.
            </div>

        </div>

    </main>


    <script>

        /* Protect Dashboard */

        const session =
            JSON.parse(
                localStorage.getItem("secureVaultSession")
            );


        if (!session) {

            window.location.href = "index.html";

        } else {

            document.getElementById("userName").textContent =
                session.username;

            document.getElementById("dashboardUsername").textContent =
                session.username;

            document.getElementById("dashboardEmail").textContent =
                session.email;

        }


        /* Logout */

        document.getElementById("logoutBtn")
            .addEventListener("click", () => {

                localStorage.removeItem("secureVaultSession");

                window.location.href = "index.html";

            });

    </script>

</body>
</html>
