<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault | Authentication System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
    </div>

    <main class="auth-container">

        <!-- Logo / Branding -->
        <div class="brand">
            <div class="logo">🔐</div>
            <h1>SecureVault</h1>
            <p>Secure • Simple • Reliable</p>
        </div>

        <!-- Authentication Card -->
        <div class="auth-card">

            <!-- Tabs -->
            <div class="tabs">
                <button id="loginTab" class="tab active">
                    Login
                </button>

                <button id="registerTab" class="tab">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-header">
                    <h2>Welcome Back 👋</h2>
                    <p>Login to access your secure dashboard.</p>
                </div>

                <div class="input-group">
                    <label for="loginUsername">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="loginPassword"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <p id="loginMessage" class="message"></p>

                <button type="submit" class="primary-btn">
                    Login →
                </button>

            </form>


            <!-- Registration Form -->
            <form id="registerForm" class="hidden">

                <div class="form-header">
                    <h2>Create Account 🚀</h2>
                    <p>Register to create your secure account.</p>
                </div>

                <div class="input-group">
                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        autocomplete="username"
                    >
                </div>

                <div class="input-group">
                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="registerPassword"
                        >
                            👁
                        </button>
                    </div>

                    <!-- Password Strength -->
                    <div class="strength-container">
                        <div class="strength-bar">
                            <span id="strengthBar"></span>
                        </div>

                        <small id="strengthText">
                            Password strength
                        </small>
                    </div>
                </div>

                <p id="registerMessage" class="message"></p>

                <button type="submit" class="primary-btn">
                    Create Account →
                </button>

            </form>

        </div>

        <!-- Security Badge -->
        <div class="security-badge">
            <span>🛡️</span>
            <div>
                <strong>Secure Authentication</strong>
                <small>Your account is protected</small>
            </div>
        </div>

        <p class="footer-text">
            Task 4 • OIBSIP Web Development Internship
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
