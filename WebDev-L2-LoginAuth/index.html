<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>authFlow | Secure Authentication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background-glow"></div>

    <!-- Logo -->
    <header class="logo">
        <div class="logo-box">aF</div>
        <span>authFlow</span>
    </header>

    <!-- Authentication Card -->
    <main class="auth-container">

        <!-- Login -->
        <section class="auth-card" id="loginSection">

            <div class="card-header">
                <h1>Welcome Back</h1>
                <p>Login to continue</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginUser">Username or Email</label>
                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Enter username or email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <p id="loginError" class="error-message"></p>

                <button type="submit" class="main-btn">
                    Login
                </button>

            </form>

            <p class="switch-text">
                Don't have an account?
                <button type="button" onclick="showRegister()">
                    Create Account
                </button>
            </p>

        </section>


        <!-- Register -->
        <section class="auth-card hidden" id="registerSection">

            <div class="card-header">
                <h1>Create Account</h1>
                <p>Register to get started</p>
            </div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="registerUsername">Username</label>
                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword('registerPassword', this)"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >
                </div>

                <p id="registerError" class="error-message"></p>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <button type="button" onclick="showLogin()">
                    Login
                </button>
            </p>

        </section>

    </main>

    <footer>
        <span>🔒</span>
        Secure Authentication
        <small>Your account is protected</small>
    </footer>

    <script src="script.js"></script>

</body>
</html>
