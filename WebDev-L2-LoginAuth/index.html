<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault | Authentication System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="auth-wrapper">

        <!-- Logo -->
        <div class="brand">
            <div class="brand-icon">🔐</div>
            <span>Secure<span>Vault</span></span>
        </div>

        <!-- Authentication Card -->
        <div class="auth-card">

            <div class="card-header">
                <div class="shield">🛡️</div>

                <h1 id="formTitle">Welcome Back</h1>

                <p id="formSubtitle">
                    Login to access your secure dashboard.
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="input-group">
                    <label for="loginUsername">
                        Username or Email
                    </label>

                    <div class="input-box">
                        <span>👤</span>

                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="Enter username or email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-box">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            id="loginEye"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div id="loginMessage" class="message"></div>

                <button type="submit" class="primary-btn">
                    Login
                    <span>→</span>
                </button>

            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden">

                <div class="input-group">
                    <label for="registerUsername">
                        Username
                    </label>

                    <div class="input-box">
                        <span>👤</span>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Choose a username"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="registerEmail">
                        Email
                    </label>

                    <div class="input-box">
                        <span>✉️</span>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="input-box">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            id="registerEye"
                        >
                            👁️
                        </button>
                    </div>

                    <div class="strength">
                        <div class="strength-bar">
                            <div id="strengthFill"></div>
                        </div>

                        <small id="strengthText">
                            Password strength
                        </small>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">
                        <span>🔐</span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>
                </div>

                <div id="registerMessage" class="message"></div>

                <button type="submit" class="primary-btn">
                    Create Account
                    <span>→</span>
                </button>

            </form>

            <!-- Switch -->
            <div class="switch-area">

                <p id="switchText">
                    Don't have an account?
                </p>

                <button id="switchBtn">
                    Create Account
                </button>

            </div>

        </div>

        <!-- Security Badge -->
        <div class="security-note">
            <span>🛡️</span>

            <div>
                <strong>Secure Authentication</strong>
                <p>Your account is protected</p>
            </div>
        </div>

        <footer>
            Task 4 • OIBSIP Web Development Internship
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
