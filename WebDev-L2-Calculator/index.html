<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator Web Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <div class="calculator-section">

            <div class="top-bar">
                <div>
                    <h1>Calculator</h1>
                    <p>Smart • Simple • Fast</p>
                </div>

                <button id="themeToggle" class="theme-btn" title="Toggle Theme">
                    🌙
                </button>
            </div>

            <div class="calculator">

                <input
                    type="text"
                    id="display"
                    placeholder="0"
                    readonly
                >

                <div class="buttons">

                    <button class="special" data-action="clear">AC</button>
                    <button class="special" data-action="backspace">⌫</button>
                    <button class="special" data-action="square">x²</button>
                    <button class="operator" data-value="/">÷</button>

                    <button class="special" data-action="sqrt">√</button>
                    <button data-value="7">7</button>
                    <button data-value="8">8</button>
                    <button data-value="9">9</button>

                    <button class="operator" data-value="*">×</button>
                    <button data-value="4">4</button>
                    <button data-value="5">5</button>
                    <button data-value="6">6</button>

                    <button class="operator" data-value="-">−</button>
                    <button data-value="1">1</button>
                    <button data-value="2">2</button>
                    <button data-value="3">3</button>

                    <button class="operator" data-value="+">+</button>
                    <button class="zero" data-value="0">0</button>
                    <button data-value=".">.</button>
                    <button class="equal" data-action="calculate">=</button>

                </div>

            </div>

        </div>

        <div class="history-section">

            <div class="history-header">
                <h2>History</h2>
                <button id="clearHistory">Clear</button>
            </div>

            <div id="historyList">
                <p class="empty-history">No calculations yet</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
