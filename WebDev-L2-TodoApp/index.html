<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Smart To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header>
            <div>
                <p class="welcome">MY PRODUCTIVITY SPACE</p>
                <h1>Task<span>Flow</span></h1>
                <p class="subtitle">Organize your day. Focus on what matters.</p>
            </div>

            <button id="themeToggle" class="theme-btn" title="Toggle theme">
                ☾
            </button>
        </header>

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span id="totalTasks">0</span>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <span id="activeTasks">0</span>
                <p>Active</p>
            </div>

            <div class="stat-card completed-stat">
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>
        </section>

        <!-- Add Task -->
        <section class="add-task-section">
            <div class="input-group">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you want to accomplish today?"
                >

                <select id="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>

                <button id="addTaskBtn">+ Add Task</button>
            </div>
        </section>

        <!-- Search and Filter -->
        <section class="task-tools">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search your tasks..."
            >

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </section>

        <!-- Task List -->
        <main>
            <div id="taskList" class="task-list"></div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✓</div>
                <h3>Your day is clear!</h3>
                <p>Add a task and start making progress.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>TaskFlow • Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
